name: Release

on:
  push:
    branches: [main]

# Never run two releases at once, and never cancel one mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the version branch, tags and GitHub releases
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      # Not npm 12: it rejects the --git-checks flag pnpm 9 passes through
      # to `npm publish` (npm 11 only warns).
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # With pending changesets: opens/updates the "Version Packages" PR.
      # With none (i.e. the version PR was just merged): builds and publishes
      # whatever versions npm doesn't have yet. Auth is OIDC; no NPM_TOKEN.
      # Stay on v1 until @changesets/cli moves to v3: action v2 refuses CLI v2.
      - uses: changesets/action@v1
        with:
          version: pnpm release:version
          publish: pnpm release:publish
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
